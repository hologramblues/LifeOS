<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <meta name="theme-color" content="#0a0a0f">
  <title>Life OS Cockpit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --accent-cyan: #22d3ee;
      --accent-violet: #a78bfa;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --accent-pink: #ec4899;
      --gradient-fab: linear-gradient(135deg, #22d3ee, #a78bfa);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ========================================
       MOBILE LAYOUT - Pages avec bottom nav
       ======================================== */
    
    .mobile-app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Page container - une seule page visible */
    .page {
      display: none;
      flex: 1;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      overflow-y: auto;
      animation: fadeIn 0.3s ease-out;
    }
    .page.active { display: block; }

    /* Page header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .page-action {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--glass-bg);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-action:active { transform: scale(0.95); }

    /* Bottom Navigation - Mobile */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(70px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-secondary);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }
    .nav-item.active { color: var(--accent-cyan); }

    /* ========================================
       DESKTOP LAYOUT - Bento Dashboard
       ======================================== */

    .desktop-app {
      display: none;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 72px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      z-index: 100;
    }
    .sidebar-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--gradient-fab);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .sidebar-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .sidebar-btn:hover { background: var(--glass-bg); color: var(--text-secondary); }
    .sidebar-btn.active { background: rgba(34, 211, 238, 0.1); color: var(--accent-cyan); }
    .sidebar-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* Main content */
    .main-content {
      margin-left: 72px;
      padding: 32px;
      min-height: 100vh;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .dashboard-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .dashboard-actions { display: flex; gap: 12px; align-items: center; }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: minmax(280px, auto);
      gap: 20px;
      max-width: 1200px;
    }

    /* Bento Card */
    .bento {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      transition: all 0.3s;
      animation: fadeIn 0.4s ease-out;
      display: flex;
      flex-direction: column;
    }
    .bento:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .bento-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .bento-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bento-menu {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
    }
    .bento-content { flex: 1; overflow: hidden; }
    .bento-add {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px dashed var(--glass-border);
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .bento-add:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(34, 211, 238, 0.1);
    }

    /* ========================================
       SHARED COMPONENTS
       ======================================== */

    /* Task Item */
    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .task-item:hover { background: rgba(255, 255, 255, 0.04); }
    .task-item:last-child { margin-bottom: 0; }

    .task-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .task-checkbox.done {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }
    .task-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: white;
      stroke-width: 3;
      opacity: 0;
    }
    .task-checkbox.done svg { opacity: 1; }

    .task-info { flex: 1; min-width: 0; }
    .task-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      transition: all 0.2s;
    }
    .task-name.done {
      text-decoration: line-through;
      opacity: 0.4;
    }
    .task-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
    }

    .task-priority {
      width: 4px;
      border-radius: 2px;
      flex-shrink: 0;
      align-self: stretch;
    }
    .priority-high { background: var(--accent-red); }
    .priority-medium { background: var(--accent-orange); }
    .priority-low { background: var(--text-muted); }

    /* Habit Ring */
    .habits-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .habit-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .ring-container {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .ring-svg {
      transform: rotate(-90deg);
      width: 80px;
      height: 80px;
    }
    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 6;
    }
    .ring-progress {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease-out;
    }
    .ring-progress.cyan { stroke: var(--accent-cyan); }
    .ring-progress.violet { stroke: var(--accent-violet); }
    .ring-progress.blue { stroke: var(--accent-blue); }
    .ring-progress.green { stroke: var(--accent-green); }
    .ring-progress.pink { stroke: var(--accent-pink); }
    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 600;
    }
    .habit-name {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Event Item */
    .event-item {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .event-item:last-child { border-bottom: none; }
    .event-date {
      text-align: center;
      min-width: 44px;
    }
    .event-day-name {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .event-day-num {
      font-size: 20px;
      font-weight: 700;
    }
    .event-info {
      flex: 1;
      border-left: 3px solid var(--accent-violet);
      padding-left: 12px;
    }
    .event-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .event-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Chat */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }
    .chat-message {
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease-out;
    }
    .chat-message.user {
      display: flex;
      justify-content: flex-end;
    }
    .chat-message.user .chat-bubble {
      background: var(--gradient-fab);
      color: white;
      border-radius: 18px 18px 4px 18px;
    }
    .chat-message.assistant .chat-bubble {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px 18px 18px 4px;
    }
    .chat-bubble {
      max-width: 85%;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.5;
    }
    .chat-input-container {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--glass-border);
    }
    .chat-input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: white;
      font-size: 15px;
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--accent-cyan);
    }
    .chat-send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--gradient-fab);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-send:disabled { opacity: 0.5; }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .empty-text { font-size: 14px; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 30px;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--glass-border);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      animation: slideUp 0.3s ease-out;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--glass-bg);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
    }
    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .input:focus {
      border-color: var(--accent-cyan);
    }
    .input::placeholder { color: var(--text-muted); }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: var(--gradient-fab);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.5; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      background: var(--bg-tertiary);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success { border-color: var(--accent-green); }
    .toast.error { border-color: var(--accent-red); }

    /* ========================================
       RESPONSIVE
       ======================================== */

    @media (max-width: 767px) {
      .desktop-app { display: none !important; }
      .mobile-app { display: flex; }
    }

    @media (min-width: 768px) {
      .mobile-app { display: none !important; }
      .desktop-app { display: block; }
      
      .bento-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .modal-content {
        position: fixed;
        bottom: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: fadeIn 0.2s ease-out;
      }
    }

    @media (min-width: 1200px) {
      .bento-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- ========================================
       MOBILE APP
       ======================================== -->
  <div class="mobile-app">
    
    <!-- PAGE: Tasks -->
    <div class="page active" id="page-tasks">
      <div class="page-header">
        <h1 class="page-title">Tâches</h1>
        <button class="page-action" onclick="openModal('task')">+</button>
      </div>
      <div id="mobile-tasks-list">
        <div class="loading"><div class="loading-spinner"></div><span>Chargement...</span></div>
      </div>
    </div>

    <!-- PAGE: Habits -->
    <div class="page" id="page-habits">
      <div class="page-header">
        <h1 class="page-title">Habitudes</h1>
        <button class="page-action" onclick="openModal('habit')">+</button>
      </div>
      <div id="mobile-habits-list">
        <div class="loading"><div class="loading-spinner"></div><span>Chargement...</span></div>
      </div>
    </div>

    <!-- PAGE: Calendar -->
    <div class="page" id="page-calendar">
      <div class="page-header">
        <h1 class="page-title">Agenda</h1>
        <button class="page-action" onclick="openModal('event')">+</button>
      </div>
      <div id="mobile-events-list">
        <div class="loading"><div class="loading-spinner"></div><span>Chargement...</span></div>
      </div>
    </div>

    <!-- PAGE: Chat (Molty) -->
    <div class="page" id="page-chat">
      <div class="page-header">
        <h1 class="page-title">Molty</h1>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-message assistant">
            <div class="chat-bubble">Salut ! Je suis Molty, ton assistant. Comment puis-je t'aider ? 🤖</div>
          </div>
        </div>
        <div class="chat-input-container">
          <input type="text" class="chat-input" id="chat-input" placeholder="Message...">
          <button class="chat-send" id="chat-send" onclick="sendChat()">↑</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="tasks">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Tâches
      </button>
      <button class="nav-item" data-page="habits">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Habitudes
      </button>
      <button class="nav-item" data-page="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Agenda
      </button>
      <button class="nav-item" data-page="chat">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Molty
      </button>
    </nav>
  </div>

  <!-- ========================================
       DESKTOP APP
       ======================================== -->
  <div class="desktop-app">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">C</div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn active" title="Dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="sidebar-btn" title="Tasks">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </button>
        <button class="sidebar-btn" title="Calendar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button class="sidebar-btn" title="Chat">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </button>
      </nav>
      <button class="sidebar-btn" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="dashboard-header">
        <h1 class="dashboard-title">Cockpit</h1>
        <div class="dashboard-actions">
          <div class="avatar">JG</div>
        </div>
      </div>

      <!-- Bento Grid -->
      <div class="bento-grid">
        
        <!-- Today's Focus -->
        <div class="bento">
          <div class="bento-header">
            <span class="bento-title">Today's Focus</span>
            <button class="bento-menu">⋯</button>
          </div>
          <div class="bento-content" id="bento-tasks">
            <div class="loading"><div class="loading-spinner"></div></div>
          </div>
          <button class="bento-add" onclick="openModal('task')">+</button>
        </div>

        <!-- Habit Streaks -->
        <div class="bento">
          <div class="bento-header">
            <span class="bento-title">Habit Streaks</span>
            <button class="bento-menu">⋯</button>
          </div>
          <div class="bento-content" id="bento-habits">
            <div class="loading"><div class="loading-spinner"></div></div>
          </div>
          <button class="bento-add" onclick="openModal('habit')">+</button>
        </div>

        <!-- Upcoming -->
        <div class="bento">
          <div class="bento-header">
            <span class="bento-title">Upcoming</span>
            <button class="bento-menu">⋯</button>
          </div>
          <div class="bento-content" id="bento-events">
            <div class="loading"><div class="loading-spinner"></div></div>
          </div>
          <button class="bento-add" onclick="openModal('event')">+</button>
        </div>

        <!-- Chat with Molty -->
        <div class="bento">
          <div class="bento-header">
            <span class="bento-title">Molty</span>
            <button class="bento-menu">⋯</button>
          </div>
          <div class="bento-content">
            <div class="chat-container" style="height: 220px;">
              <div class="chat-messages" id="bento-chat-messages">
                <div class="chat-message assistant">
                  <div class="chat-bubble">Comment puis-je t'aider ? 🤖</div>
                </div>
              </div>
              <div class="chat-input-container">
                <input type="text" class="chat-input" id="bento-chat-input" placeholder="Message...">
                <button class="chat-send" onclick="sendBentoChat()">↑</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ========================================
       MODAL
       ======================================== -->
  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Ajouter</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <input type="text" class="input" id="modal-input" placeholder="...">
      <div id="modal-extra"></div>
      <button class="submit-btn" id="modal-submit" onclick="submitModal()">Ajouter</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ========================================
       JAVASCRIPT
       ======================================== -->
  <script>
    // === CONFIG ===
    const API_BASE = '/api/n8n?endpoint=';
    const MOLTY_URL = 'https://openclaw-production-b53e.up.railway.app/v1/chat/completions';

    // === STATE ===
    let tasks = [];
    let habits = [];
    let events = [];
    let projects = [];
    let currentPage = 'tasks';
    let modalType = 'task';
    let chatHistory = [];
    let bentoChatHistory = [];

    // === INIT ===
    document.addEventListener('DOMContentLoaded', async () => {
      // Load from localStorage first for instant display
      loadFromStorage();
      renderAll();

      // Then fetch fresh data
      await Promise.all([fetchTasks(), fetchProjects(), fetchEvents()]);
      loadHabits();
      renderAll();

      // Navigation listeners
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => switchPage(btn.dataset.page));
      });

      // Chat enter key
      document.getElementById('chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendChat();
      });
      document.getElementById('bento-chat-input')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') sendBentoChat();
      });
    });

    // === STORAGE ===
    function loadFromStorage() {
      const stored = localStorage.getItem('lifeos_data');
      if (stored) {
        const data = JSON.parse(stored);
        tasks = data.tasks || [];
        habits = data.habits || [];
        events = data.events || [];
      }
    }

    function saveToStorage() {
      localStorage.setItem('lifeos_data', JSON.stringify({ tasks, habits, events }));
    }

    // === FETCH ===
    async function fetchTasks() {
      try {
        const res = await fetch(`${API_BASE}lifeos-tasks`);
        const data = await res.json();
        if (data.tasks) {
          tasks = data.tasks.map(t => ({
            id: t.id,
            title: t.title,
            done: t.done || false,
            priority: t.priority || 'Medium',
            dueDate: t.dueDate,
            project: t.project
          }));
          saveToStorage();
        }
      } catch (e) { console.error('Fetch tasks error:', e); }
    }

    async function fetchProjects() {
      try {
        const res = await fetch(`${API_BASE}lifeos-projects`);
        const data = await res.json();
        if (data.projects) projects = data.projects;
      } catch (e) { console.error('Fetch projects error:', e); }
    }

    async function fetchEvents() {
      try {
        const res = await fetch(`${API_BASE}lifeos-events`);
        const data = await res.json();
        if (data.events) {
          events = data.events;
          saveToStorage();
        }
      } catch (e) { console.error('Fetch events error:', e); }
    }

    function loadHabits() {
      const stored = localStorage.getItem('lifeos_habits');
      if (stored) {
        habits = JSON.parse(stored);
      } else {
        habits = [
          { id: 'h1', name: 'Méditation', color: 'cyan', streak: 5 },
          { id: 'h2', name: 'Sport', color: 'violet', streak: 3 },
          { id: 'h3', name: 'Lecture', color: 'blue', streak: 7 }
        ];
        saveHabits();
      }
    }

    function saveHabits() {
      localStorage.setItem('lifeos_habits', JSON.stringify(habits));
    }

    // === NAVIGATION ===
    function switchPage(page) {
      currentPage = page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${page}`).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-page="${page}"]`).classList.add('active');
    }

    // === RENDER ===
    function renderAll() {
      renderTasks();
      renderHabits();
      renderEvents();
    }

    function renderTasks() {
      const sorted = [...tasks]
        .sort((a, b) => {
          if (a.done !== b.done) return a.done ? 1 : -1;
          const order = { High: 0, Medium: 1, Low: 2 };
          return (order[a.priority] || 1) - (order[b.priority] || 1);
        });

      const html = sorted.length === 0
        ? '<div class="empty"><div class="empty-icon">✨</div><div class="empty-text">Aucune tâche</div></div>'
        : sorted.map(t => `
          <div class="task-item" onclick="toggleTask('${t.id}')">
            <div class="task-priority priority-${(t.priority || 'medium').toLowerCase()}"></div>
            <div class="task-checkbox ${t.done ? 'done' : ''}">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="task-info">
              <div class="task-name ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                ${t.dueDate ? `<span>📅 ${formatDate(t.dueDate)}</span>` : ''}
              </div>
            </div>
          </div>
        `).join('');

      // Mobile
      const mobileList = document.getElementById('mobile-tasks-list');
      if (mobileList) mobileList.innerHTML = html;

      // Desktop bento (top 5)
      const bentoList = document.getElementById('bento-tasks');
      if (bentoList) {
        bentoList.innerHTML = sorted.slice(0, 5).length === 0
          ? '<div class="empty"><div class="empty-icon">✨</div></div>'
          : sorted.slice(0, 5).map(t => `
            <div class="task-item" onclick="toggleTask('${t.id}')">
              <div class="task-priority priority-${(t.priority || 'medium').toLowerCase()}"></div>
              <div class="task-checkbox ${t.done ? 'done' : ''}">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="task-info">
                <div class="task-name ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
              </div>
            </div>
          `).join('');
      }
    }

    function renderHabits() {
      const colors = ['cyan', 'violet', 'blue', 'green', 'pink'];
      
      const html = habits.length === 0
        ? '<div class="empty"><div class="empty-icon">🎯</div><div class="empty-text">Aucune habitude</div></div>'
        : `<div class="habits-grid">${habits.map((h, i) => {
            const circumference = 2 * Math.PI * 34;
            const progress = Math.min((h.streak || 0) / 7 * 100, 100);
            const offset = circumference - (progress / 100) * circumference;
            const color = h.color || colors[i % colors.length];
            return `
              <div class="habit-ring" onclick="toggleHabit('${h.id}')">
                <div class="ring-container">
                  <svg class="ring-svg" viewBox="0 0 80 80">
                    <circle class="ring-bg" cx="40" cy="40" r="34"/>
                    <circle class="ring-progress ${color}" cx="40" cy="40" r="34" 
                      stroke-dasharray="${circumference}" 
                      stroke-dashoffset="${offset}"/>
                  </svg>
                  <div class="ring-text">${h.streak || 0}</div>
                </div>
                <div class="habit-name">${escapeHtml(h.name)}</div>
              </div>
            `;
          }).join('')}</div>`;

      // Mobile
      const mobileList = document.getElementById('mobile-habits-list');
      if (mobileList) mobileList.innerHTML = html;

      // Desktop bento
      const bentoList = document.getElementById('bento-habits');
      if (bentoList) bentoList.innerHTML = html;
    }

    function renderEvents() {
      const sorted = [...events].sort((a, b) => new Date(a.date || a.start) - new Date(b.date || b.start));

      const html = sorted.length === 0
        ? '<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Aucun événement</div></div>'
        : sorted.map(e => {
            const d = new Date(e.date || e.start);
            return `
              <div class="event-item">
                <div class="event-date">
                  <div class="event-day-name">${d.toLocaleDateString('fr', { weekday: 'short' })}</div>
                  <div class="event-day-num">${d.getDate()}</div>
                </div>
                <div class="event-info">
                  <div class="event-title">${escapeHtml(e.title)}</div>
                  <div class="event-time">${e.time || 'Journée'}</div>
                </div>
              </div>
            `;
          }).join('');

      // Mobile
      const mobileList = document.getElementById('mobile-events-list');
      if (mobileList) mobileList.innerHTML = html;

      // Desktop bento (top 4)
      const bentoList = document.getElementById('bento-events');
      if (bentoList) {
        bentoList.innerHTML = sorted.slice(0, 4).length === 0
          ? '<div class="empty"><div class="empty-icon">📅</div></div>'
          : sorted.slice(0, 4).map(e => {
              const d = new Date(e.date || e.start);
              return `
                <div class="event-item">
                  <div class="event-date">
                    <div class="event-day-name">${d.toLocaleDateString('fr', { weekday: 'short' })}</div>
                    <div class="event-day-num">${d.getDate()}</div>
                  </div>
                  <div class="event-info">
                    <div class="event-title">${escapeHtml(e.title)}</div>
                    <div class="event-time">${e.time || 'Journée'}</div>
                  </div>
                </div>
              `;
            }).join('');
      }
    }

    // === ACTIONS ===
    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      task.done = !task.done;
      renderAll();
      saveToStorage();

      if (task.done) showToast('Tâche complétée ! 🎉', 'success');

      try {
        await fetch(`${API_BASE}lifeos-toggle-task`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId: id, done: task.done })
        });
      } catch (e) {
        console.error('Toggle error:', e);
      }
    }

    function toggleHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      habit.streak = (habit.streak || 0) + 1;
      renderAll();
      saveHabits();
      showToast(`${habit.name} +1 ! 🔥`, 'success');
      if (navigator.vibrate) navigator.vibrate(10);
    }

    // === MODAL ===
    function openModal(type) {
      modalType = type;
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const input = document.getElementById('modal-input');
      const extra = document.getElementById('modal-extra');

      const config = {
        task: { title: '✓ Nouvelle tâche', placeholder: 'Titre de la tâche...' },
        habit: { title: '🎯 Nouvelle habitude', placeholder: 'Nom de l\'habitude...' },
        event: { title: '📅 Nouvel événement', placeholder: 'Titre de l\'événement...' }
      };

      title.textContent = config[type]?.title || 'Ajouter';
      input.placeholder = config[type]?.placeholder || '...';
      input.value = '';

      extra.innerHTML = type === 'event' 
        ? '<input type="date" class="input" id="event-date" style="margin-top:8px">'
        : '';

      modal.classList.add('open');
      setTimeout(() => input.focus(), 100);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    async function submitModal() {
      const input = document.getElementById('modal-input');
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('modal-submit');
      btn.disabled = true;

      try {
        if (modalType === 'task') {
          const newTask = { id: 't' + Date.now(), title: text, done: false, priority: 'Medium' };
          tasks.unshift(newTask);
          saveToStorage();
          renderAll();

          fetch(`${API_BASE}lifeos-create-task`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: text })
          }).then(r => r.json()).then(d => {
            if (d.taskId) newTask.id = d.taskId;
          }).catch(() => {});

        } else if (modalType === 'habit') {
          const colors = ['cyan', 'violet', 'blue', 'green', 'pink'];
          habits.push({
            id: 'h' + Date.now(),
            name: text,
            color: colors[habits.length % colors.length],
            streak: 0
          });
          saveHabits();
          renderAll();

        } else if (modalType === 'event') {
          const date = document.getElementById('event-date')?.value || new Date().toISOString().split('T')[0];
          events.push({ id: 'e' + Date.now(), title: text, date });
          saveToStorage();
          renderAll();

          fetch('https://hologramblues.app.n8n.cloud/webhook/lifeos-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: text, startTime: `${date}T09:00:00` })
          }).catch(() => {});
        }

        showToast('Ajouté ! ✨', 'success');
        closeModal();

      } finally {
        btn.disabled = false;
      }
    }

    // === CHAT ===
    async function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const container = document.getElementById('chat-messages');

      // Add user message
      container.innerHTML += `<div class="chat-message user"><div class="chat-bubble">${escapeHtml(text)}</div></div>`;
      container.scrollTop = container.scrollHeight;

      // Add typing indicator
      container.innerHTML += `<div class="chat-message assistant" id="typing"><div class="chat-bubble" style="animation:pulse 1s infinite">...</div></div>`;

      chatHistory.push({ role: 'user', content: text });

      try {
        const res = await fetch(MOLTY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'kimi-k2-0711-preview',
            messages: chatHistory,
            max_tokens: 500
          })
        });

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'Désolé, je n\'ai pas compris.';

        document.getElementById('typing')?.remove();
        container.innerHTML += `<div class="chat-message assistant"><div class="chat-bubble">${escapeHtml(reply)}</div></div>`;
        chatHistory.push({ role: 'assistant', content: reply });

      } catch (e) {
        document.getElementById('typing')?.remove();
        container.innerHTML += `<div class="chat-message assistant"><div class="chat-bubble">Oups, je ne suis pas disponible. 😅</div></div>`;
      }

      container.scrollTop = container.scrollHeight;
    }

    async function sendBentoChat() {
      const input = document.getElementById('bento-chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const container = document.getElementById('bento-chat-messages');

      container.innerHTML += `<div class="chat-message user"><div class="chat-bubble">${escapeHtml(text)}</div></div>`;
      container.innerHTML += `<div class="chat-message assistant" id="bento-typing"><div class="chat-bubble">...</div></div>`;

      bentoChatHistory.push({ role: 'user', content: text });

      try {
        const res = await fetch(MOLTY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'kimi-k2-0711-preview',
            messages: bentoChatHistory,
            max_tokens: 300
          })
        });

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || '...';

        document.getElementById('bento-typing')?.remove();
        container.innerHTML += `<div class="chat-message assistant"><div class="chat-bubble">${escapeHtml(reply)}</div></div>`;
        bentoChatHistory.push({ role: 'assistant', content: reply });

      } catch (e) {
        document.getElementById('bento-typing')?.remove();
        container.innerHTML += `<div class="chat-message assistant"><div class="chat-bubble">❌</div></div>`;
      }

      container.scrollTop = container.scrollHeight;
    }

    // === HELPERS ===
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      if (d.toDateString() === tomorrow.toDateString()) return 'Demain';
      return d.toLocaleDateString('fr', { day: 'numeric', month: 'short' });
    }

    function showToast(message, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
