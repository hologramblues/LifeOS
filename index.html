<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <meta name="theme-color" content="#0f172a">
  <title>Life OS Cockpit</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230f172a' width='100' height='100' rx='20'/><text y='65' x='50' text-anchor='middle' font-size='50'>🚀</text></svg>">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: white;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }
    
    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 500;
    }
    
    .header {
      padding: 16px 20px 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .header h1 { font-size: 28px; font-weight: 700; }
    .header p { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .streak { 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    /* Filter bar */
    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-chip.active {
      background: rgba(139, 92, 246, 0.3);
      border-color: #8b5cf6;
      color: white;
    }
    .filter-chip .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 11px;
    }
    
    .tabs {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab.active {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .content { padding: 16px 20px 120px; }
    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid #6b7280;
    }
    .card:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
    .card-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .card-meta { display: flex; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.4); flex-wrap: wrap; align-items: center; }
    .card-meta span { display: flex; align-items: center; gap: 4px; }
    .priority-high { border-left-color: #ef4444; }
    .priority-medium { border-left-color: #f59e0b; }
    .priority-low { border-left-color: #6b7280; }
    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .checkbox.done { background: #22c55e; border-color: #22c55e; }
    .task-row { display: flex; align-items: flex-start; gap: 12px; }
    .task-content { flex: 1; min-width: 0; }
    .task-title.done { text-decoration: line-through; opacity: 0.5; }
    
    /* My Day badge */
    .myday-badge {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    /* Task actions */
    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .task-action-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .task-action-btn:active { background: rgba(255,255,255,0.1); }
    .task-action-btn.active { background: rgba(251, 191, 36, 0.2); border-color: #fbbf24; color: #fbbf24; }
    
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin: 20px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .add-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 2px dashed rgba(139, 92, 246, 0.3);
      background: rgba(139, 92, 246, 0.1);
      color: #a78bfa;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .add-btn:active { background: rgba(139, 92, 246, 0.2); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
    }
    .badge-today { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge-tomorrow { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .pipeline {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .pipeline::-webkit-scrollbar { display: none; }
    .pipeline-col {
      flex: 0 0 200px;
    }
    .pipeline-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
    }
    .pipeline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .pipeline-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .pipeline-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .pipeline-card p { font-size: 12px; color: rgba(255,255,255,0.4); }
    .project-progress {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }
    .project-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #6366f1);
      border-radius: 2px;
      transition: width 0.3s;
    }
    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
      z-index: 200;
      transition: all 0.2s;
    }
    .fab:active { transform: scale(0.9); }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .type-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .type-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-btn.active { background: #8b5cf6; color: white; }
    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .input:focus { border-color: #8b5cf6; }
    .input::placeholder { color: rgba(255,255,255,0.3); }
    .row { display: flex; gap: 12px; }
    .row .input { flex: 1; }
    select.input { appearance: none; cursor: pointer; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .submit-btn:disabled { opacity: 0.5; }
    .submit-btn:active:not(:disabled) { transform: scale(0.98); }
    .note-types { margin: 12px 0; }
    .note-types p { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
    .hidden { display: none !important; }
    
    /* Task options in modal */
    .task-options {
      margin: 12px 0;
    }
    .task-options label {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
    }
    .priority-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .priority-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .priority-btn.active { border-width: 2px; }
    .priority-btn[data-priority="High"].active { 
      background: rgba(239, 68, 68, 0.2); 
      border-color: #ef4444; 
      color: #ef4444; 
    }
    .priority-btn[data-priority="Medium"].active { 
      background: rgba(245, 158, 11, 0.2); 
      border-color: #f59e0b; 
      color: #f59e0b; 
    }
    .priority-btn[data-priority="Low"].active { 
      background: rgba(107, 114, 128, 0.2); 
      border-color: #6b7280; 
      color: #9ca3af; 
    }
    
    .myday-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
      cursor: pointer;
    }
    .myday-toggle input { display: none; }
    .myday-toggle .toggle-track {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      transition: all 0.2s;
    }
    .myday-toggle input:checked + .toggle-track {
      background: #fbbf24;
    }
    .myday-toggle .toggle-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: all 0.2s;
    }
    .myday-toggle input:checked + .toggle-track .toggle-thumb {
      left: 22px;
    }
    .myday-toggle span {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }
    
    .empty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.3); }
    
    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      overflow-x: auto;
    }
    .stat-item {
      text-align: center;
      flex: 0 0 auto;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  
  <header class="header">
    <h1>Life OS <span class="streak" id="streak">🔥 0</span></h1>
    <p id="greeting">Bonjour Jeremie</p>
  </header>

  <!-- Stats bar -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="stat-done">0</div>
      <div class="stat-label">Faites</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-todo">0</div>
      <div class="stat-label">À faire</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-myday">0</div>
      <div class="stat-label">My Day</div>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="today">✓ Today</button>
    <button class="tab" data-tab="notes">📝 Notes</button>
    <button class="tab" data-tab="calendar">📅 Agenda</button>
    <button class="tab" data-tab="projects">🚀 Projets</button>
    <button class="tab" data-tab="people">👥 CRM</button>
  </nav>

  <!-- Filters (only on Today tab) -->
  <div class="filters" id="filters">
    <button class="filter-chip active" data-filter="all">Toutes <span class="count" id="count-all">0</span></button>
    <button class="filter-chip" data-filter="myday">☀️ My Day <span class="count" id="count-myday">0</span></button>
    <button class="filter-chip" data-filter="high">🔥 Urgentes <span class="count" id="count-high">0</span></button>
    <button class="filter-chip" data-filter="todo">⏳ À faire <span class="count" id="count-todo">0</span></button>
  </div>

  <main class="content">
    <!-- TODAY -->
    <section id="today" class="tab-content">
      <div id="tasks-list"></div>
    </section>

    <!-- NOTES -->
    <section id="notes" class="tab-content hidden">
      <button class="add-btn" onclick="openCapture('note')">+ Nouvelle note</button>
      <div class="section-title">📝 Notes récentes</div>
      <div id="notes-list"></div>
    </section>

    <!-- CALENDAR -->
    <section id="calendar" class="tab-content hidden">
      <button class="add-btn" onclick="openCapture('event')">+ Ajouter un événement</button>
      <div class="section-title">📅 Prochains événements</div>
      <div id="events-list"></div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="tab-content hidden">
      <div class="section-title">🚀 Projets actifs</div>
      <div id="projects-list"></div>
    </section>

    <!-- PEOPLE -->
    <section id="people" class="tab-content hidden">
      <div class="pipeline" id="pipeline"></div>
      <button class="add-btn" onclick="openCapture('contact')">+ Nouveau contact</button>
    </section>
  </main>

  <button class="fab" onclick="openCapture('task')">+</button>

  <!-- Modal -->
  <div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>⚡ Capture rapide</h3>
      <div class="type-btns">
        <button class="type-btn active" data-type="task">✓ Tâche</button>
        <button class="type-btn" data-type="note">📝 Note</button>
        <button class="type-btn" data-type="event">📅 Event</button>
        <button class="type-btn" data-type="project">🚀 Projet</button>
        <button class="type-btn" data-type="contact">👤 Contact</button>
      </div>
      <input type="text" class="input" id="captureInput" placeholder="Qu'est-ce que tu veux capturer ?">
      
      <!-- Task options -->
      <div id="taskOptions" class="task-options">
        <label>Priorité</label>
        <div class="priority-btns">
          <button class="priority-btn" data-priority="High">🔥 High</button>
          <button class="priority-btn active" data-priority="Medium">⚡ Medium</button>
          <button class="priority-btn" data-priority="Low">💤 Low</button>
        </div>
        
        <label>Projet</label>
        <select class="input" id="taskProject">
          <option value="">📁 Aucun projet</option>
        </select>
        
        <label class="myday-toggle">
          <input type="checkbox" id="taskMyDay" checked>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span>☀️ Ajouter à My Day</span>
        </label>
        
        <label>Date d'échéance (optionnel)</label>
        <input type="date" class="input" id="taskDueDate">
      </div>
      
      <!-- Note type selector -->
      <div id="noteOptions" class="note-types hidden">
        <p>Type de note</p>
        <div class="type-btns">
          <button class="type-btn active" data-notetype="Idea">💡 Idea</button>
          <button class="type-btn" data-notetype="Reference">📚 Reference</button>
          <button class="type-btn" data-notetype="Meeting">🤝 Meeting</button>
          <button class="type-btn" data-notetype="Journal">📓 Journal</button>
          <button class="type-btn" data-notetype="Plan">📋 Plan</button>
        </div>
        <select class="input" id="noteProject">
          <option value="">📁 Aucun projet</option>
        </select>
      </div>

      <!-- Event options -->
      <div id="eventOptions" class="hidden">
        <div class="row">
          <input type="date" class="input" id="eventDate">
          <input type="time" class="input" id="eventTime">
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="capture()">Ajouter</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFETTI SYSTEM
    // ==========================================
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiPieces = [];
    let confettiAnimating = false;
    
    function resizeConfettiCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    resizeConfettiCanvas();
    window.addEventListener('resize', resizeConfettiCanvas);
    
    class ConfettiPiece {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 10 + 5;
        this.speedX = Math.random() * 6 - 3;
        this.speedY = Math.random() * -15 - 5;
        this.gravity = 0.5;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 10 - 5;
        this.color = ['#8b5cf6', '#6366f1', '#22c55e', '#fbbf24', '#ef4444', '#ec4899'][Math.floor(Math.random() * 6)];
        this.opacity = 1;
        this.shape = Math.random() > 0.5 ? 'rect' : 'circle';
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.speedY += this.gravity;
        this.rotation += this.rotationSpeed;
        this.opacity -= 0.01;
      }
      
      draw() {
        confettiCtx.save();
        confettiCtx.translate(this.x, this.y);
        confettiCtx.rotate(this.rotation * Math.PI / 180);
        confettiCtx.globalAlpha = this.opacity;
        confettiCtx.fillStyle = this.color;
        
        if (this.shape === 'rect') {
          confettiCtx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);
        } else {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          confettiCtx.fill();
        }
        
        confettiCtx.restore();
      }
    }
    
    function launchConfetti(x, y) {
      for (let i = 0; i < 50; i++) {
        confettiPieces.push(new ConfettiPiece(x || window.innerWidth / 2, y || window.innerHeight / 2));
      }
      
      if (!confettiAnimating) {
        confettiAnimating = true;
        animateConfetti();
      }
      
      // Haptic feedback
      if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
    }
    
    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      
      confettiPieces = confettiPieces.filter(p => p.opacity > 0 && p.y < confettiCanvas.height);
      
      confettiPieces.forEach(p => {
        p.update();
        p.draw();
      });
      
      if (confettiPieces.length > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimating = false;
      }
    }

    // ==========================================
    // CONFIG
    // ==========================================
    const N8N_BASE = '/api/n8n?endpoint=';
    const N8N_NOTE_URL = 'https://hologramblues.app.n8n.cloud/webhook/lifeos-note';
    const N8N_EVENT_URL = 'https://hologramblues.app.n8n.cloud/webhook/lifeos-event';
    const N8N_TASKS_URL = `${N8N_BASE}lifeos-tasks`;
    const N8N_PROJECTS_URL = `${N8N_BASE}lifeos-projects`;
    const N8N_TOGGLE_URL = `${N8N_BASE}lifeos-toggle`;
    const N8N_CREATE_TASK_URL = `${N8N_BASE}lifeos-create-task`;
    const N8N_UPDATE_TASK_URL = `${N8N_BASE}lifeos-update-task`;

    // ==========================================
    // STATE
    // ==========================================
    let currentTab = 'today';
    let currentFilter = 'all';
    let captureType = 'task';
    let noteType = 'Idea';
    let taskPriority = 'Medium';
    let isLoading = false;
    let projectsMap = {};
    let completedToday = 0;
    
    let tasks = [];
    let notes = [];
    let events = [];
    let projects = [];
    let people = [];

    const priorityColors = { High: '#ef4444', Medium: '#f59e0b', Low: '#6b7280' };
    const noteTypeColors = { Idea: '#f59e0b', Reference: '#6b7280', Meeting: '#eab308', Journal: '#8b5cf6', Plan: '#3b82f6' };
    const pipelineColors = { Prospect: '#6b7280', Contacted: '#3b82f6', Negotiating: '#f59e0b', Closed: '#22c55e' };

    // ==========================================
    // GREETING & STATS
    // ==========================================
    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting = 'Bonjour';
      if (hour >= 18) greeting = 'Bonsoir';
      else if (hour >= 12) greeting = 'Bon après-midi';
      document.getElementById('greeting').textContent = `${greeting} Jeremie`;
    }
    
    function updateStats() {
      const done = tasks.filter(t => t.done).length;
      const todo = tasks.filter(t => !t.done).length;
      const myday = tasks.filter(t => t.myDay && !t.done).length;
      const high = tasks.filter(t => t.priority === 'High' && !t.done).length;
      
      document.getElementById('stat-done').textContent = done;
      document.getElementById('stat-todo').textContent = todo;
      document.getElementById('stat-myday').textContent = myday;
      
      // Update filter counts
      document.getElementById('count-all').textContent = tasks.length;
      document.getElementById('count-myday').textContent = tasks.filter(t => t.myDay).length;
      document.getElementById('count-high').textContent = high;
      document.getElementById('count-todo').textContent = todo;
      
      // Update streak (simplified - just show completed today)
      document.getElementById('streak').textContent = `🔥 ${completedToday}`;
    }

    // ==========================================
    // API FUNCTIONS
    // ==========================================
    function setLoading(loading) {
      isLoading = loading;
      const header = document.querySelector('.header');
      if (loading) {
        if (!document.getElementById('loading-indicator')) {
          const indicator = document.createElement('div');
          indicator.id = 'loading-indicator';
          indicator.innerHTML = '⟳';
          indicator.style.cssText = 'position:absolute;top:20px;right:20px;animation:spin 1s linear infinite;font-size:18px;';
          header.style.position = 'relative';
          header.appendChild(indicator);
        }
      } else {
        const indicator = document.getElementById('loading-indicator');
        if (indicator) indicator.remove();
      }
    }

    async function fetchTasks() {
      try {
        setLoading(true);
        const res = await fetch(N8N_TASKS_URL);
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();
        
        if (data.tasks && Array.isArray(data.tasks)) {
          tasks = data.tasks.map(t => ({
            id: t.id,
            title: t.title,
            done: t.done || false,
            priority: t.priority || 'Medium',
            project: projectsMap[t.project] || null,
            projectId: t.project,
            time: t.dueDate ? new Date(t.dueDate).toLocaleTimeString('fr', { hour: '2-digit', minute: '2-digit' }) : null,
            dueDate: t.dueDate,
            myDay: t.myDay || false
          }));
          renderTasks();
          updateStats();
        }
      } catch (err) {
        console.error('Fetch tasks error:', err);
        document.getElementById('tasks-list').innerHTML = '<div class="empty">📡 Impossible de charger<br><small>Tire pour rafraîchir</small></div>';
      } finally {
        setLoading(false);
      }
    }

    async function fetchProjects() {
      try {
        const res = await fetch(N8N_PROJECTS_URL);
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();
        
        if (data.projects && Array.isArray(data.projects)) {
          projects = data.projects.map(p => ({
            id: p.id,
            name: p.name,
            status: p.status || 'Planned',
            done: p.tasksDone || 0,
            total: p.tasksTotal || 0
          }));
          
          projectsMap = {};
          projects.forEach(p => projectsMap[p.id] = p.name);
          
          renderProjects();
          updateProjectDropdowns();
        }
      } catch (err) {
        console.error('Fetch projects error:', err);
      }
    }

    function updateProjectDropdowns() {
      const taskSelect = document.getElementById('taskProject');
      const noteSelect = document.getElementById('noteProject');
      
      const options = '<option value="">📁 Aucun projet</option>' + 
        projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      
      if (taskSelect) taskSelect.innerHTML = options;
      if (noteSelect) noteSelect.innerHTML = options;
    }

    async function toggleTaskAPI(taskId, done) {
      try {
        await fetch(N8N_TOGGLE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId, done })
        });
      } catch (err) {
        console.error('Toggle error:', err);
        tasks = tasks.map(t => t.id === taskId ? { ...t, done: !done } : t);
        renderTasks();
      }
    }
    
    async function toggleMyDayAPI(taskId, myDay) {
      try {
        await fetch(N8N_UPDATE_TASK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ taskId, myDay })
        });
      } catch (err) {
        console.error('Toggle My Day error:', err);
        tasks = tasks.map(t => t.id === taskId ? { ...t, myDay: !myDay } : t);
        renderTasks();
      }
    }

    // ==========================================
    // PULL TO REFRESH
    // ==========================================
    let touchStartY = 0;
    let isPulling = false;
    
    document.addEventListener('touchstart', e => {
      if (window.scrollY === 0) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (window.scrollY === 0 && !isLoading) {
        const touchY = e.touches[0].clientY;
        const pull = touchY - touchStartY;
        
        if (pull > 60 && !isPulling) {
          isPulling = true;
          document.querySelector('.header').style.transform = 'translateY(10px)';
        }
      }
    }, { passive: true });

    document.addEventListener('touchend', async () => {
      if (isPulling && !isLoading) {
        isPulling = false;
        document.querySelector('.header').style.transform = '';
        await Promise.all([fetchTasks(), fetchProjects()]);
        if (navigator.vibrate) navigator.vibrate(10);
      }
    });

    // ==========================================
    // TABS & FILTERS
    // ==========================================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        document.getElementById(currentTab).classList.remove('hidden');
        
        // Show/hide filters
        document.getElementById('filters').style.display = currentTab === 'today' ? 'flex' : 'none';
        document.getElementById('stats-bar').style.display = currentTab === 'today' ? 'flex' : 'none';
      });
    });
    
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderTasks();
      });
    });

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    function renderTasks() {
      let filtered = [...tasks];
      
      // Apply filter
      switch (currentFilter) {
        case 'myday':
          filtered = filtered.filter(t => t.myDay);
          break;
        case 'high':
          filtered = filtered.filter(t => t.priority === 'High' && !t.done);
          break;
        case 'todo':
          filtered = filtered.filter(t => !t.done);
          break;
      }
      
      // Sort: undone first, then by priority
      const sorted = filtered.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const order = { High: 0, Medium: 1, Low: 2 };
        return order[a.priority] - order[b.priority];
      });
      
      document.getElementById('tasks-list').innerHTML = sorted.map(t => `
        <div class="card priority-${t.priority.toLowerCase()}" data-id="${t.id}">
          <div class="task-row" onclick="toggleTask('${t.id}')">
            <div class="checkbox ${t.done ? 'done' : ''}">${t.done ? '✓' : ''}</div>
            <div class="task-content">
              <div class="card-title ${t.done ? 'task-title done' : ''}">${t.title}</div>
              <div class="card-meta">
                ${t.myDay ? '<span class="myday-badge">☀️ My Day</span>' : ''}
                ${t.project ? `<span>📁 ${t.project}</span>` : ''}
                ${t.dueDate ? `<span style="color:#f59e0b">📅 ${formatDate(t.dueDate)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="task-actions">
            <button class="task-action-btn ${t.myDay ? 'active' : ''}" onclick="event.stopPropagation(); toggleMyDay('${t.id}')">
              ☀️ My Day
            </button>
          </div>
        </div>
      `).join('') || '<div class="empty">🎯 Aucune tâche<br><small>Appuie sur + pour en créer</small></div>';
      
      updateStats();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      
      const newDone = !task.done;
      tasks = tasks.map(t => t.id === id ? { ...t, done: newDone } : t);
      renderTasks();
      
      toggleTaskAPI(id, newDone);
      
      if (newDone) {
        completedToday++;
        updateStats();
        
        // Get task card position for confetti
        const card = document.querySelector(`[data-id="${id}"]`);
        if (card) {
          const rect = card.getBoundingClientRect();
          launchConfetti(rect.left + rect.width / 2, rect.top);
        } else {
          launchConfetti();
        }
      }
    }
    
    function toggleMyDay(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      
      const newMyDay = !task.myDay;
      tasks = tasks.map(t => t.id === id ? { ...t, myDay: newMyDay } : t);
      renderTasks();
      
      toggleMyDayAPI(id, newMyDay);
    }

    function renderNotes() {
      document.getElementById('notes-list').innerHTML = notes.length ? notes.map(n => `
        <div class="card" style="border-left-color: ${noteTypeColors[n.type] || '#6b7280'}">
          <div class="card-title">${n.title}</div>
          <div class="card-meta">
            <span class="badge" style="background: ${noteTypeColors[n.type]}20; color: ${noteTypeColors[n.type]}">${n.type}</span>
            ${n.project ? `<span>📁 ${n.project}</span>` : ''}
            <span>${formatDate(n.date)}</span>
          </div>
        </div>
      `).join('') : '<div class="empty">📝 Aucune note<br><small>Capture tes idées ici</small></div>';
    }

    function renderEvents() {
      const sorted = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
      const today = new Date().toISOString().split('T')[0];
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
      
      document.getElementById('events-list').innerHTML = sorted.length ? sorted.map(e => `
        <div class="card">
          <div class="card-title">${e.title}</div>
          <div class="card-meta">
            <span>📅 ${formatDate(e.date)}</span>
            ${e.time ? `<span>🕐 ${e.time}</span>` : ''}
            ${e.date === today ? '<span class="badge badge-today">Aujourd\'hui</span>' : ''}
            ${e.date === tomorrow ? '<span class="badge badge-tomorrow">Demain</span>' : ''}
          </div>
        </div>
      `).join('') : '<div class="empty">📅 Aucun événement<br><small>Ton agenda est libre</small></div>';
    }

    function renderProjects() {
      if (projects.length === 0) {
        document.getElementById('projects-list').innerHTML = '<div class="empty">🚀 Aucun projet<br><small>Lance ton premier projet</small></div>';
        return;
      }
      document.getElementById('projects-list').innerHTML = projects.map(p => {
        const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
        return `
          <div class="card">
            <div class="card-title">${p.name}</div>
            <div class="card-meta">
              <span class="badge">${p.status}</span>
              <span>${p.done}/${p.total} tâches</span>
              <span>${pct}%</span>
            </div>
            <div class="project-progress">
              <div class="project-progress-bar" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPipeline() {
      if (people.length === 0) {
        document.getElementById('pipeline').innerHTML = '<div class="empty" style="width:100%">👥 Aucun contact<br><small>Ajoute tes premiers contacts</small></div>';
        return;
      }
      const stages = ['Prospect', 'Contacted', 'Negotiating', 'Closed'];
      document.getElementById('pipeline').innerHTML = stages.map(stage => {
        const ps = people.filter(p => p.status === stage);
        return `
          <div class="pipeline-col">
            <div class="pipeline-header">
              <span class="pipeline-dot" style="background: ${pipelineColors[stage]}"></span>
              ${stage} (${ps.length})
            </div>
            ${ps.map(p => `
              <div class="pipeline-card">
                <h4>${p.name}</h4>
                ${p.company ? `<p>${p.company}</p>` : ''}
                ${p.role ? `<p>${p.role}</p>` : ''}
                ${p.next ? `<p style="color:#a78bfa; margin-top:8px">📅 ${formatDate(p.next)}</p>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    // ==========================================
    // MODAL
    // ==========================================
    function openCapture(type) {
      captureType = type;
      document.getElementById('modal').classList.add('open');
      document.getElementById('captureInput').focus();
      updateTypeButtons();
      updateCaptureUI();
    }

    function closeModal(e) {
      if (e.target.id === 'modal') {
        document.getElementById('modal').classList.remove('open');
        document.getElementById('captureInput').value = '';
        document.getElementById('taskDueDate').value = '';
        document.getElementById('taskMyDay').checked = true;
        taskPriority = 'Medium';
        updatePriorityButtons();
      }
    }

    function updateTypeButtons() {
      document.querySelectorAll('.type-btn[data-type]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === captureType);
      });
    }
    
    function updatePriorityButtons() {
      document.querySelectorAll('.priority-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.priority === taskPriority);
      });
    }

    function updateCaptureUI() {
      const input = document.getElementById('captureInput');
      const taskOpts = document.getElementById('taskOptions');
      const noteOpts = document.getElementById('noteOptions');
      const eventOpts = document.getElementById('eventOptions');
      
      taskOpts.classList.add('hidden');
      noteOpts.classList.add('hidden');
      eventOpts.classList.add('hidden');
      
      if (captureType === 'task') {
        input.placeholder = 'Nouvelle tâche...';
        taskOpts.classList.remove('hidden');
      } else if (captureType === 'note') {
        input.placeholder = 'Titre de la note...';
        noteOpts.classList.remove('hidden');
      } else if (captureType === 'event') {
        input.placeholder = "Titre de l'événement...";
        eventOpts.classList.remove('hidden');
        document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
      } else if (captureType === 'project') {
        input.placeholder = 'Nom du projet...';
      } else if (captureType === 'contact') {
        input.placeholder = 'Nom du contact...';
      }
    }

    // Type buttons
    document.querySelectorAll('.type-btn[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        captureType = btn.dataset.type;
        updateTypeButtons();
        updateCaptureUI();
      });
    });
    
    // Priority buttons
    document.querySelectorAll('.priority-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        taskPriority = btn.dataset.priority;
        updatePriorityButtons();
      });
    });

    // Note type buttons
    document.querySelectorAll('.type-btn[data-notetype]').forEach(btn => {
      btn.addEventListener('click', () => {
        noteType = btn.dataset.notetype;
        document.querySelectorAll('.type-btn[data-notetype]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ==========================================
    // CAPTURE
    // ==========================================
    async function capture() {
      const input = document.getElementById('captureInput');
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      try {
        if (captureType === 'task') {
          const projectId = document.getElementById('taskProject').value;
          const myDay = document.getElementById('taskMyDay').checked;
          const dueDate = document.getElementById('taskDueDate').value;
          
          // Add locally first
          const tempId = 't' + Date.now();
          tasks.unshift({ 
            id: tempId, 
            title: text, 
            done: false, 
            priority: taskPriority, 
            myDay,
            project: projectsMap[projectId] || null,
            projectId,
            dueDate: dueDate || null
          });
          renderTasks();
          
          // Send to n8n
          fetch(N8N_CREATE_TASK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              title: text,
              priority: taskPriority,
              projectId,
              myDay,
              dueDate
            })
          }).then(res => res.json()).then(data => {
            const task = tasks.find(t => t.id === tempId);
            if (task && data.taskId) task.id = data.taskId;
          }).catch(() => {});
          
        } else if (captureType === 'note') {
          const project = document.getElementById('noteProject').value;
          const note = { id: 'n' + Date.now(), title: text, type: noteType, project, date: new Date().toISOString().split('T')[0] };
          notes.unshift(note);
          renderNotes();
          
          fetch(N8N_NOTE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: text, type: noteType, project })
          }).catch(() => {});
          
        } else if (captureType === 'event') {
          const date = document.getElementById('eventDate').value;
          const time = document.getElementById('eventTime').value;
          if (!date) { alert('Choisis une date'); btn.disabled = false; btn.textContent = 'Ajouter'; return; }
          
          events.push({ id: 'e' + Date.now(), title: text, date, time });
          renderEvents();
          
          const startTime = time ? `${date}T${time}:00` : `${date}T09:00:00`;
          fetch(N8N_EVENT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: text, startTime })
          }).catch(() => {});
          
        } else if (captureType === 'project') {
          projects.push({ id: 'p' + Date.now(), name: text, status: 'Planned', total: 0, done: 0 });
          renderProjects();
          updateProjectDropdowns();
          
        } else if (captureType === 'contact') {
          people.push({ id: 'c' + Date.now(), name: text, status: 'Prospect' });
          renderPipeline();
        }

        // Celebration
        launchConfetti();
        document.getElementById('modal').classList.remove('open');
        input.value = '';
        document.getElementById('taskDueDate').value = '';
        document.getElementById('taskMyDay').checked = true;
        taskPriority = 'Medium';
        updatePriorityButtons();
        
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ajouter';
      }
    }

    // Enter key
    document.getElementById('captureInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') capture();
    });

    // ==========================================
    // INIT
    // ==========================================
    updateGreeting();
    updatePriorityButtons();
    
    renderTasks();
    renderNotes();
    renderEvents();
    renderProjects();
    renderPipeline();
    
    // Fetch real data
    (async () => {
      await fetchProjects();
      await fetchTasks();
    })();
  </script>
</body>
</html>
